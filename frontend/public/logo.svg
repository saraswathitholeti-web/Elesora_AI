<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="eleysoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle glow -->
  <circle cx="50" cy="50" r="44" stroke="url(#eleysoraGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <!-- Neural interconnected nodes forming an abstract stylized E -->
  <path d="M 28 25 L 72 25 M 28 50 L 64 50 M 28 75 L 72 75 M 28 25 L 28 75" 
        stroke="url(#eleysoraGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Synaptic nodes -->
  <circle cx="28" cy="25" r="5" fill="#8B5CF6" />
  <circle cx="72" cy="25" r="4" fill="#22D3EE" />
  <circle cx="28" cy="50" r="4" fill="#6366F1" />
  <circle cx="64" cy="50" r="5" fill="#22D3EE" />
  <circle cx="28" cy="75" r="5" fill="#8B5CF6" />
  <circle cx="72" cy="75" r="4" fill="#22D3EE" />
  <!-- Inner Inclusion Bridge Arch -->
  <path d="M 46 36 C 58 42, 58 58, 46 64" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
</svg>
